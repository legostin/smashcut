<!doctype html>
<html><head><meta charset="utf-8"><title>music render</title>
<script src="/vendor/Tone.js"></script>
<script src="/runtime/music.js"></script>
<script>window.__musicExt = window.__musicExt || [];</script>
<script src="/runtime/music-ext/index.js"></script>
</head><body>
<script>
  const src = new URLSearchParams(location.search).get('src');
  const s = document.createElement('script');
  s.src = src + (src.includes('?') ? '&' : '?') + 'v=' + Date.now();
  s.onerror = () => window.__music.errors.push('failed to load ' + src);
  document.body.appendChild(s);
</script>
</body></html>
